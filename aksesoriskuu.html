<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AksesorisKu – Aksesoris HP Terlengkap</title>
<style>
:root{--blue:#1769ff;--blue2:#0b4dd1;--soft:#eef4ff;--bg:#fff;--ink:#0d1117;--mute:#5b6572;--line:#e5eaf2;--card:#fff;--shadow:0 6px 24px rgba(23,105,255,.10);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0f17;--ink:#f1f5fb;--mute:#9aa5b5;--line:#1f2937;--card:#131a26;--soft:#101a2e;--shadow:0 6px 24px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0f17;--ink:#f1f5fb;--mute:#9aa5b5;--line:#1f2937;--card:#131a26;--soft:#101a2e;--shadow:0 6px 24px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
input,textarea{font:inherit;color:var(--ink)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
/* splash */
#splash{position:fixed;inset:0;background:#fff;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
#splash::before{content:"";position:absolute;width:min(320px,85vw);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(23,105,255,.20),rgba(23,105,255,0) 65%);animation:halo 2.2s 1s ease-out both}
#splash::after{content:"";position:absolute;width:min(210px,54vw);aspect-ratio:1;border-radius:50%;border:2px solid rgba(23,105,255,.45);animation:ring 1.4s 1s ease-out both}
#splash .lg{position:relative;z-index:1;width:min(210px,54vw);height:auto;animation:pop 1.1s 1s cubic-bezier(.2,.9,.25,1.1) both,glow 1.6s 2.3s ease-in-out infinite}
.orb{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;z-index:2;opacity:0;pointer-events:none}
.orb.k{background:radial-gradient(circle at 35% 30%,#3a3f4a,#0d1117 70%);animation:orbL 1.6s cubic-bezier(.55,0,.35,1) forwards}
.orb.b{background:radial-gradient(circle at 35% 30%,#6aa8ff,#1769ff 70%);animation:orbR 1.6s cubic-bezier(.55,0,.35,1) forwards}
#splash b{font-size:26px;color:#0d1117;letter-spacing:.5px;animation:fade 1s .35s both}
#splash b i{color:var(--blue);font-style:normal}
.bar{width:120px;height:3px;background:#e5eaf2;border-radius:3px;overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--blue);animation:load 2.5s .3s forwards}
@keyframes pop{0%{opacity:0;transform:scale(.35) rotate(-10deg);filter:blur(10px)}55%{opacity:1;transform:scale(1.08) rotate(2deg);filter:blur(0)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes halo{0%{opacity:0;transform:scale(.3)}60%{opacity:1}100%{opacity:1;transform:scale(1.05)}}
@keyframes ring{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(1.7)}}
@keyframes glow{50%{filter:drop-shadow(0 8px 18px rgba(23,105,255,.35))}}
@keyframes orbL{0%{opacity:0;transform:translateX(-48vw) scale(.7)}12%{opacity:1}55%{opacity:1;transform:translateX(-4px) scale(1)}68%{opacity:1;transform:translateX(0) scale(1.25)}100%{opacity:0;transform:translateX(0) scale(3)}}
@keyframes orbR{0%{opacity:0;transform:translateX(48vw) scale(.7)}12%{opacity:1}55%{opacity:1;transform:translateX(4px) scale(1)}68%{opacity:1;transform:translateX(0) scale(1.25)}100%{opacity:0;transform:translateX(0) scale(3)}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes load{to{width:100%}}
/* header */
header{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.hrow{display:flex;align-items:center;gap:10px;padding:10px 0}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;cursor:pointer}
.mk{width:38px;height:38px;border-radius:10px;background:#fff;display:grid;place-items:center;flex:none;border:1px solid var(--line)}.mk img{width:30px;height:auto}.brand i{color:var(--blue);font-style:normal}
.search{flex:1;display:flex;align-items:center;background:var(--soft);border-radius:12px;padding:0 12px;min-width:0}
.search input{flex:1;border:0;background:none;padding:11px 8px;outline:0;min-width:0}
.ibtn{position:relative;width:42px;height:42px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:19px}
.badge{position:absolute;top:-4px;right:-4px;background:var(--blue);color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px;font-weight:700}
.badge:empty,.badge[data-n="0"]{display:none}
/* hero */
.greet{padding:18px 0 4px}.greet h2{font-size:22px}.greet p{color:var(--mute);font-size:14px;margin-top:2px}
.banner{margin-top:12px;border-radius:20px;padding:26px 22px;color:#fff;background:linear-gradient(120deg,#0b4dd1,#1769ff 55%,#4c9bff);position:relative;overflow:hidden;box-shadow:var(--shadow)}
.banner h3{font-size:24px;max-width:70%;line-height:1.2}.banner p{margin:8px 0 14px;opacity:.9;font-size:14px;max-width:70%}
.banner .cta{background:#fff;color:var(--blue2);padding:10px 18px;border-radius:12px;font-weight:700}
.banner .big{position:absolute;right:-6px;bottom:-14px;font-size:112px;opacity:.9;animation:float 3.5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px) rotate(4deg)}}
/* cats */
.cats{display:flex;gap:10px;overflow-x:auto;padding:16px 0 4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.chip{flex:none;padding:10px 16px;border-radius:999px;background:var(--soft);font-weight:600;font-size:14px;border:1px solid transparent;transition:.2s}
.chip.on{background:var(--blue);color:#fff}
.sec{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px}.sec h3{font-size:19px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:16px}}
@media(min-width:960px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s;animation:fade .5s both}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.pic{aspect-ratio:1;display:grid;place-items:center;font-size:62px;position:relative;cursor:pointer}
.tag{position:absolute;left:8px;top:8px;background:#0d1117;color:#fff;font-size:10px;padding:3px 8px;border-radius:8px;font-weight:700}
.heart{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.92);color:#aab3c2;font-size:16px;display:grid;place-items:center}
.heart.on{color:#ef4444}
.pic img,.main img{width:100%;height:100%;object-fit:cover;display:block}.main{overflow:hidden}
.cb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.cb .nm{font-size:14px;font-weight:600;cursor:pointer;line-height:1.3}
.cb .pr{color:var(--blue);font-weight:800}
.cb .sub{color:var(--mute);font-size:12px}
.btn{background:var(--blue);color:#fff;padding:11px 16px;border-radius:12px;font-weight:700;transition:.2s}
.btn:hover{background:var(--blue2)}.btn.alt{background:#0d1117;color:#fff}.btn.ghost{background:var(--soft);color:var(--blue)}
.btn.sm{padding:9px;font-size:13px;margin-top:auto}
.btn.wa{background:#22c55e}.btn.sp{background:#ee4d2d}
/* detail */
.back{margin:14px 0;color:var(--blue);font-weight:700}
.det{display:grid;gap:20px}@media(min-width:800px){.det{grid-template-columns:1fr 1fr;gap:36px}}
.main{aspect-ratio:1;border-radius:20px;display:grid;place-items:center;font-size:150px;transition:background .3s}
.thumbs{display:flex;gap:10px;margin-top:10px}
.th{width:64px;height:64px;border-radius:12px;display:grid;place-items:center;font-size:30px;border:2px solid transparent}
.th.on{border-color:var(--blue)}
.det h1{font-size:24px}.det .price{font-size:26px;color:var(--blue);font-weight:800;margin:8px 0}
.var{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 16px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px}
.qty button{width:38px;height:38px;font-size:18px}.qty span{min-width:30px;text-align:center;font-weight:700}
.row2{display:flex;gap:10px;margin-top:18px}.row2 .btn{flex:1}
/* cart */
.item{display:flex;gap:12px;padding:12px;border:1px solid var(--line);border-radius:16px;margin-bottom:10px;background:var(--card);align-items:center}
.item .t{width:64px;height:64px;border-radius:12px;display:grid;place-items:center;font-size:32px;flex:none}
.item .i{flex:1;min-width:0}.item .i b{font-size:14px;display:block}.item .i small{color:var(--mute)}
.del{color:#ef4444;font-size:18px;padding:6px}
.sum{background:var(--soft);border-radius:16px;padding:16px;margin:16px 0}
.sum div{display:flex;justify-content:space-between;padding:4px 0}.sum .tot{font-weight:800;font-size:18px;border-top:1px dashed var(--line);margin-top:6px;padding-top:10px}
.co{display:grid;gap:20px}@media(min-width:800px){.co{grid-template-columns:1.2fr 1fr}}
.f{display:grid;gap:6px;margin-bottom:12px;font-size:13px;font-weight:600}
.f input,.f textarea{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;outline:0;font-weight:400}
.f input:focus,.f textarea:focus{border-color:var(--blue)}
.note{font-size:13px;color:var(--mute);background:var(--soft);padding:12px;border-radius:12px;margin:12px 0}
.empty{text-align:center;padding:50px 0;color:var(--mute)}.empty .e{font-size:56px}
/* misc */
footer{margin-top:44px;background:#0d1117;color:#cbd5e1;padding:32px 0 90px;font-size:14px}
footer h4{color:#fff;margin-bottom:8px}footer .cols{display:grid;gap:18px}@media(min-width:700px){footer .cols{grid-template-columns:2fr 1fr 1fr}}
footer a{color:#8ab4ff;cursor:pointer;display:block;padding:2px 0;text-decoration:none}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:#22c55e;color:#fff;font-size:28px;display:grid;place-items:center;box-shadow:0 8px 24px rgba(34,197,94,.5);z-index:40;text-decoration:none;animation:pulse 2.4s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:#0d1117;color:#fff;padding:12px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:.3s;z-index:60;font-size:14px;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.skel{background:linear-gradient(90deg,var(--soft),var(--line),var(--soft));background-size:200% 100%;animation:sk 1.1s infinite;border-radius:16px;aspect-ratio:.8}
@keyframes sk{to{background-position:-200% 0}}
#app{min-height:60vh}
/* ===== tampilan baru ===== */
.hrow{padding-bottom:6px}.brand{flex:1;min-width:0}
.hello small{display:block;color:var(--mute);font-size:12px;font-weight:500}.hello b{font-size:18px}.hello .bn i{color:var(--blue);font-style:normal}
.mk{width:44px;height:44px;border-radius:50%}.mk img{width:34px}
.srow{display:flex;gap:10px;padding-bottom:12px}
.search{background:var(--soft);border-radius:16px}.search input{padding:13px 8px}.ibtn{border-radius:16px;width:46px;height:46px;flex:none}
.promo{margin-top:14px;display:flex;border-radius:26px;overflow:hidden;background:var(--soft);box-shadow:var(--shadow);min-height:176px}
.pl{flex:1.25;background:linear-gradient(135deg,#0b4dd1,#1769ff);color:#fff;padding:22px 18px;border-radius:26px 44px 44px 26px;display:flex;flex-direction:column;justify-content:center;gap:14px;position:relative;z-index:1}
.pl h3{font-size:20px;line-height:1.25}
.promo .cta{background:#fff;color:var(--blue2);padding:11px 18px;border-radius:12px;font-weight:700;align-self:flex-start;box-shadow:0 6px 14px rgba(0,0,0,.18)}
.pr2{flex:1;position:relative;display:grid;place-items:center;font-size:78px}
.pr2 .s2,.pr2 .s3{position:absolute;font-size:34px;animation:float 3.5s ease-in-out infinite}.pr2 .s2{top:14px;right:14px}.pr2 .s3{bottom:12px;left:8px;animation-delay:1s}
.card{border:0;background:var(--soft);border-radius:22px}
.pic{aspect-ratio:1/1.05;font-size:74px;border-radius:22px 22px 0 0;background-blend-mode:normal}
.heart{width:34px;height:34px;box-shadow:0 2px 8px rgba(0,0,0,.12)}.heart.on{color:var(--blue)}
.cb{padding:12px 14px 14px;gap:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.add{width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;font-size:22px;font-weight:700;line-height:1;box-shadow:0 6px 12px rgba(23,105,255,.35);flex:none}
.more{color:var(--blue);font-size:13px;font-weight:600}
.chip{background:var(--card);border:1px solid var(--line);box-shadow:0 2px 8px rgba(23,105,255,.06)}.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.bnav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;z-index:35;display:flex;justify-content:space-between;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px;box-shadow:0 10px 30px rgba(23,105,255,.20)}
.nb{display:flex;align-items:center;gap:0;transition:background .3s,padding .35s cubic-bezier(.3,.9,.3,1);border-radius:999px;font-weight:700;font-size:14px;color:var(--ink)}
.nb i{position:relative;font-style:normal;width:46px;height:46px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:20px;box-shadow:0 6px 14px rgba(23,105,255,.35)}
.nb i{transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.nb span{max-width:0;opacity:0;overflow:hidden;white-space:nowrap;margin-left:0;transition:max-width .4s cubic-bezier(.3,.9,.3,1),opacity .3s,margin .3s}
.nb.on{background:var(--soft);padding-right:16px}.nb.on span{max-width:96px;opacity:1;margin-left:8px}
.nb.on i{animation:bump .55s cubic-bezier(.3,1.4,.5,1)}.nb:active i{transform:scale(.86)}
.bnav{animation:navin .8s 2.9s cubic-bezier(.2,.9,.25,1.1) both}
@keyframes bump{0%{transform:scale(.8)}50%{transform:scale(1.2) translateY(-5px)}100%{transform:scale(1)}}
@keyframes navin{from{transform:translateY(130%);opacity:0}to{transform:none;opacity:1}}
.lo{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.55);border-radius:12px;padding:9px 12px;font-weight:700;font-size:13px;flex:none}
.nb .badge{background:#ef4444;color:#fff;top:-3px;right:-3px}
.fab{bottom:calc(92px + env(safe-area-inset-bottom,0px));width:50px;height:50px;font-size:24px}
#toast{bottom:104px}
.srvst{display:none;margin-top:10px;font-size:14px}.srv .srvst{display:block}.srv .manual{display:none}
.f.ck{display:flex;align-items:center;gap:8px;font-weight:600}.f.ck input{width:20px;height:20px;padding:0}
#dlg{position:fixed;inset:0;background:rgba(13,17,23,.55);z-index:70;display:none;align-items:center;justify-content:center;padding:24px}#dlg.show{display:flex;animation:fade .25s both}
.dbox{background:var(--card);color:var(--ink);border-radius:22px;padding:22px;width:100%;max-width:340px;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:pop2 .3s cubic-bezier(.2,1.2,.3,1) both}.dbox p{font-weight:600;margin-bottom:6px;line-height:1.4}
@keyframes pop2{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.ahead{display:flex;align-items:center;gap:12px;padding:20px 18px;border-radius:0 0 26px 26px;margin:0 -16px;background:linear-gradient(135deg,#0b4dd1,#1769ff);color:#fff}
.av{width:56px;height:56px;border-radius:50%;background:#fff;color:var(--blue);display:grid;place-items:center;font-size:24px;font-weight:800;flex:none}
.ai{flex:1;min-width:0}.ai b{display:block;font-size:18px}.ai small{opacity:.9;font-size:13px}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:14px}
.box h3{font-size:17px}.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.stb{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;padding:10px 2px;border-radius:14px}.stb.on{background:var(--soft);color:var(--blue);font-weight:700}
.stb i{font-style:normal;font-size:28px;position:relative}.stb .badge{top:-4px;right:-10px}
.lrow{display:flex;justify-content:space-between;width:100%;padding:14px 4px;border-top:1px solid var(--line);font-size:15px;text-align:left}
.ord{border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:10px}.oh{display:flex;justify-content:space-between;margin-bottom:8px}.oh small{color:var(--mute)}
.ol{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:2px 0}.ol.tot{font-weight:700;border-top:1px dashed var(--line);margin-top:6px;padding-top:8px}
.ord select{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px;font:inherit}
.ord .row2{margin-top:6px;align-items:center}
.rs{display:flex;gap:8px}.rs input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px;outline:0;font-weight:400}.rs .btn{padding:10px 14px;font-size:13px}.ord .row2 .btn{padding:10px 8px;font-size:13px;white-space:nowrap}footer{padding-bottom:120px}

</style>
</head>

function addCart(id,q=1,v,silent){
  const p=byId(id);v=v||p.v[0];if(p.st!=null&&p.st<=0)return toast("Maaf, stok habis");
  const it=cart.find(x=>x.id==id&&x.v==v);
  it?it.q+=q:cart.push({id:+id,v,q});
  save();if(!silent)toast("✓ "+p.n+" ditambahkan ke keranjang");
  if(location.hash==="#cart")render();
}
function chg(i,d){cart[i].q+=d;if(cart[i].q<1)cart.splice(i,1);save();render()}

}

function home(){
  const f=P.filter(p=>(cat==="Semua"||p.c===cat)&&p.n.toLowerCase().includes(query.toLowerCase()));
  if(sortBy===1)f.sort((a,b)=>a.p-b.p);if(sortBy===2)f.sort((a,b)=>b.p-a.p);if(sortBy===3)f.sort((a,b)=>b.s-a.s);
  const filtering=cat!=="Semua"||query||sortBy;
  return `${filtering?"":`<div class="promo"><div class="pl"><h3>Nikmati diskon hingga 30% di promo spesial kami!</h3><button class="cta" onclick="pick('Powerbank')">Belanja Sekarang</button></div><div class="pr2"><span>🎧</span><span class="s2">🔋</span><span class="s3">📱</span></div></div>`}
  <div class="sec" style="margin-bottom:0"><h3>Kategori</h3></div><div class="cats"><button class="chip ${cat==="Semua"?"on":""}" onclick="pick('Semua')">Semua</button>${CATS.map(c=>`<button class="chip ${cat===c?"on":""}" onclick="pick('${c}')">${c}</button>`).join("")}</div>
  ${filtering?`<div class="sec"><h3>${query?'Hasil "'+query.replace(/</g,"&lt;")+'"':(cat==="Semua"?"Urut: "+SORTS[sortBy]:cat)}</h3><span class="sub">${f.length} produk</span></div>${grid(f)}`:
  `<div class="sec"><h3>Produk Populer</h3><button class="more" onclick="document.getElementById('all').scrollIntoView({behavior:'smooth'})">Lihat Semua</button></div>${grid([...P].sort((a,b)=>b.s-a.s).slice(0,4))}
   <div class="sec"><h3>Produk Terbaru</h3></div>${grid(P.filter(p=>p.nw).slice(0,4))}
   <div class="sec" id="all"><h3>Semua Produk</h3></div>${grid(P)}`}`;
}
function pick(c){cat=c;query="";$("#q").value="";if(location.hash!=="#home")go("home");else render()}
let sel={v:null,q:1,img:0};
function product(id){
  const p=byId(id);if(!p)return notFound();
  if(sel.id!==p.id)sel={id:p.id,v:p.v[0],q:1,img:0};
  const rel=P.filter(x=>x.c===p.c&&x.id!==p.id).concat(P.filter(x=>x.c!==p.c)).slice(0,4);
  const tints=[p.bg,"#f1f5f9","#0d1117"];
  return `<button class="back" onclick="history.length>1?history.back():go('home')">← Kembali</button>
  <div class="det"><div><div class="main" style="background:${tints[sel.img]}">${imgs(p)[sel.img]?`<img src="${imgs(p)[sel.img]}" alt="${p.n}">`:p.e}</div>
  <div class="thumbs">${(imgs(p).length?imgs(p):tints).map((t,i)=>`<button class="th ${sel.img===i?"on":""}" style="background:${imgs(p).length?'#fff':t}" onclick="sel.img=${i};render()">${imgs(p).length?`<img src="${t}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:10px">`:p.e}</button>`).join("")}</div></div>
  <div><span class="sub" style="color:var(--mute)">${p.c}</span><h1>${p.n}</h1><div class="price">${rp(p.p)}</div>
  <p style="color:var(--mute);font-size:14px">Terjual ${p.s.toLocaleString("id-ID")} • ⭐ 4.8</p>
  <p style="margin:14px 0;line-height:1.6">${p.d}</p>
  <b style="font-size:14px">Variasi</b><div class="var">${p.v.map(v=>`<button class="chip ${sel.v===v?"on":""}" onclick="sel.v='${v}';render()">${v}</button>`).join("")}</div>
  <b style="font-size:14px">Jumlah</b><div style="margin-top:8px"><div class="qty"><button onclick="sel.q=Math.max(1,sel.q-1);render()">−</button><span>${sel.q}</span><button onclick="sel.q++;render()">+</button></div></div>
  <div class="row2"><button class="btn ghost" onclick="addCart(${p.id},sel.q,sel.v)">Add to Cart</button><button class="btn" onclick="buyNowGo(${p.id})">Buy Now</button></div>
  <button class="btn ghost" style="margin-top:10px;width:100%" onclick="fav(${p.id})">${wish.includes(p.id)?"♥ Hapus dari favorit":"♡ Simpan ke favorit"}</button></div></div>
  <div class="sec"><h3>Produk Terkait</h3></div>${grid(rel)}`;
}
function buyNowGo(id){buyNow=[{id,v:sel.v,q:sel.q}];go("checkout")}
function cartPage(){
  if(!cart.length)return `<div class="empty"><div class="e">🛒</div><p>Keranjang masih kosong</p><br><button class="btn" onclick="go('home')">Mulai Belanja</button></div>`;
  return `<div class="sec"><h3>Keranjang Belanja</h3><button onclick="ask('Kosongkan keranjang?',()=>{cart=[];save();render()},'Kosongkan')" style="color:#ef4444;font-size:13px">Kosongkan</button></div>
  <div class="co"><div>${cart.map((c,i)=>{const p=byId(c.id);return `<div class="item"><div class="t" style="background:${p.bg}">${p.e}</div><div class="i"><b>${p.n}</b><small>${c.v} • ${rp(p.p)}</small>
  <div style="margin-top:6px"><div class="qty"><button onclick="chg(${i},-1)">−</button><span>${c.q}</span><button onclick="chg(${i},1)">+</button></div></div></div>
  <div style="text-align:right"><b>${rp(p.p*c.q)}</b><br><button class="del" onclick="del(${i})" aria-label="Hapus">🗑</button></div></div>`}).join("")}</div>
  <div><div class="sum"><div><span>Subtotal (${cart.reduce((a,b)=>a+b.q,0)} barang)</span><span>${rp(total(cart))}</span></div><div><span>Ongkir</span><span>Dihitung penjual</span></div><div class="tot"><span>Total</span><span>${rp(total(cart))}</span></div></div>
  <button class="btn" style="width:100%" onclick="buyNow=null;go('checkout')">Lanjut ke Checkout</button></div></div>`;
}
function wishPage(){
  const l=P.filter(p=>wish.includes(p.id));
  return `<div class="sec"><h3>Favorit Saya</h3></div>`+(l.length?grid(l):`<div class="empty"><div class="e">♡</div><p>Belum ada produk favorit</p></div>`);
}
function checkout(){
  const l=buyNow||cart;
  if(!l.length)return cartPage();
  const cu=store.get("ak_cust",{}),c=Object.assign({},cu,user?{nm:user.nm,hp:user.hp,al:user.al||cu.al||""}:{});
  return `<button class="back" onclick="history.back()">← Kembali</button><div class="sec"><h3>Checkout</h3></div>
  <div class="co"><div>
   <label class="f">Nama Pelanggan<input id="nm" value="${(c.nm||"").replace(/"/g,"&quot;")}" placeholder="Nama lengkap"></label>
   <label class="f">Nomor WhatsApp<input id="hp" type="tel" inputmode="tel" value="${(c.hp||"").replace(/"/g,"&quot;")}" placeholder="08xxxxxxxxxx"></label>
   <label class="f">Alamat Pengiriman<textarea id="al" rows="3" placeholder="Alamat lengkap, kota, kode pos">${(c.al||"").replace(/</g,"&lt;")}</textarea></label>
   <label class="f">Catatan Tambahan (opsional)<textarea id="ct" rows="2" placeholder="Warna, varian, dll."></textarea></label></div>
  <div><div class="sum"><b>Ringkasan Pesanan</b>${l.map(x=>{const p=byId(x.id);return `<div><span>${p.n} (${x.v}) ×${x.q}</span><span>${rp(p.p*x.q)}</span></div>`}).join("")}<div class="tot"><span>Total</span><span>${rp(total(l))}</span></div></div>
  <div class="note">ℹ️ AksesorisKu tidak memproses pembayaran di website ini. Transaksi dan pembayaran diselesaikan melalui platform yang Anda pilih: Shopee atau WhatsApp penjual.</div>
  <button class="btn wa" style="width:100%;margin-bottom:10px" onclick="order('wa')">💬 Pesan via WhatsApp</button>
  <button class="btn sp" style="width:100%" onclick="order('sp')">🛍 Lanjut ke Shopee</button></div></div>`;
}
function order(m){
  const l=buyNow||cart,nm=$("#nm").value.trim(),hp=$("#hp").value.trim(),al=$("#al").value.trim(),ct=$("#ct").value.trim();
  if(m==="wa"){
    if(!nm||!hp||!al)return toast("Lengkapi nama, WhatsApp dan alamat dulu");
    store.set("ak_cust",{nm,hp,al});if(user){user={nm,hp,al};store.set("ak_user",user)}logOrder(m,l,{nm,hp,al,ct});
    let t=`Halo AksesorisKu, saya ingin memesan:\n\n`+l.map((x,i)=>{const p=byId(x.id);return `${i+1}. ${p.n} (${x.v})\n   ${x.q} x ${rp(p.p)} = ${rp(p.p*x.q)}`}).join("\n")+`\n\n*Total: ${rp(total(l))}*\n\nNama: ${nm}\nWhatsApp: ${hp}\nAlamat: ${al}`+(ct?`\nCatatan: ${ct}`:"");
    window.open(`https://wa.me/${CONFIG.WA_NUMBER}?text=${encodeURIComponent(t)}`,"_blank","noopener");
  }else{
    const first=l.length===1&&CONFIG.SHOPEE_PRODUCT[l[0].id];logOrder(m,l,{nm,hp,al,ct});
    window.open(first||CONFIG.SHOPEE_URL,"_blank","noopener");
    toast("Selesaikan pesanan di Shopee");
  }
}
function accountPage(){
  const cnt=k=>orders.filter(o=>o.s===k).length;
  const list=orders.filter(o=>accTab==="all"||o.s===accTab);
  const head=user?`<div class="ahead"><div class="av">${esc(user.nm.charAt(0).toUpperCase())}</div><div class="ai"><b>${esc(user.nm)}</b><small>📱 ${esc(user.hp)}</small></div><button class="ibtn" onclick="go('cart')" aria-label="Keranjang">🛒<span class="badge cbd"></span></button></div>`
   :`<div class="ahead"><div class="av">👤</div><div class="ai"><b>Selamat datang!</b><small>Masuk untuk mengisi data checkout otomatis dan memantau pesanan</small></div><button class="ibtn" onclick="go('cart')" aria-label="Keranjang">🛒<span class="badge cbd"></span></button></div>`;
  const addrBox=user?`<div class="box"><div class="hd"><h3>Alamat Pengiriman</h3></div><label class="f"><textarea id="ua" rows="3" placeholder="Jalan, nomor, kecamatan, kota, kode pos">${esc(user.al||"")}</textarea></label><button class="btn ghost" style="width:100%" onclick="saveAddr()">Simpan Alamat</button></div>`:"";
  const login_=user?"":`<div class="box"><div class="hd"><h3>Masuk</h3></div><label class="f">Nama<input id="ln" placeholder="Nama lengkap" autocomplete="name"></label><label class="f">Nomor WhatsApp<input id="lh" type="tel" inputmode="tel" placeholder="08xxxxxxxxxx" autocomplete="tel"></label><label class="f">Alamat Pengiriman<textarea id="la" rows="3" placeholder="Jalan, nomor, kecamatan, kota, kode pos" autocomplete="street-address"></textarea></label><button class="btn" style="width:100%" onclick="login()">Masuk</button><div class="note">Akun tersimpan di perangkat ini dan dipakai untuk mengisi data checkout otomatis. Belum memakai server, jadi tidak perlu kata sandi.</div></div>`;
  const ordHtml=list.length?list.map(o=>`<div class="ord"><div class="oh"><b>#${o.id}</b><small>${o.d}</small></div>${o.items.map(x=>`<div class="ol"><span>${esc(x.n)} (${esc(x.v)}) ×${x.q}</span><span>${rp(x.t)}</span></div>`).join("")}<div class="ol tot"><span>Total • via ${o.m==="wa"?"WhatsApp":"Shopee"}</span><span>${rp(o.total)}</span></div>
   <div class="srvst">Status: <b>${stName(o.s)}</b>${o.r?` • Resi: <b>${esc(o.r)}</b>`:""}</div><label class="f manual" style="margin-top:10px">Status pesanan<select onchange="setSt('${o.id}',this.value)">${ST.map(s=>`<option value="${s[0]}" ${o.s===s[0]?"selected":""}>${s[1]}</option>`).join("")}</select></label>
   ${o.r?`<div class="row2" style="margin:0 0 10px"><button class="btn ghost" onclick="copyResi('${o.id}')">📋 Salin Resi</button><button class="btn" onclick="trackResi('${o.id}')">🚚 Cek Resi</button></div>`:""}
   <div class="row2"><button class="btn ghost" onclick="askSeller('${o.id}')">💬 Tanya Penjual</button><button class="btn ghost" onclick="window.open(CONFIG.SHOPEE_URL,'_blank','noopener')">🛍 Shopee</button><button class="del" onclick="delOrder('${o.id}')" aria-label="Hapus">🗑</button></div></div>`).join("")
   :`<div class="empty"><div class="e">📦</div><p>${orders.length?"Tidak ada pesanan dengan status ini":"Belum ada pesanan. Pesanan yang Anda kirim lewat WhatsApp atau Shopee akan dicatat di sini."}</p></div>`;
  return head+login_+addrBox+`<div class="box"><div class="hd"><h3>Pesanan Saya</h3><button class="more" onclick="accTab='all';render()">Lihat Riwayat Pesanan ›</button></div>
  <div class="sts">${ST.map(s=>`<button class="stb ${accTab===s[0]?"on":""}" onclick="accTab=accTab==='${s[0]}'?'all':'${s[0]}';render()"><i>${s[2]}${cnt(s[0])?`<b class="badge">${cnt(s[0])}</b>`:""}</i>${s[1]}</button>`).join("")}</div>
  ${ordHtml}
  <div class="note">Ini catatan pesanan pribadi di perangkat Anda. Status resmi dan nomor resi diberikan penjual lewat WhatsApp atau halaman pesanan Shopee. Ubah status di atas sesuai konfirmasi yang Anda terima.</div></div>
  <div class="box" style="padding:6px 16px"><button class="lrow" style="border:0" onclick="go('wishlist')"><span>❤️ Favorit Saya</span><span>›</span></button><button class="lrow" onclick="go('cart')"><span>🛒 Keranjang Belanja</span><span>›</span></button><button class="lrow" onclick="window.open(document.getElementById('fab').href,'_blank','noopener')"><span>💬 Chat Penjual (WhatsApp)</span><span>›</span></button><button class="lrow" onclick="window.open(CONFIG.SHOPEE_URL,'_blank','noopener')"><span>🛍 Toko Shopee</span><span>›</span></button>${user?`<button class="lrow" style="color:#ef4444" onclick="logout()"><span>Keluar</span><span>›</span></button>`:""}</div>`;
}
const notFound=()=>`<div class="empty"><div class="e">😕</div><p>Halaman tidak ditemukan</p><br><button class="btn" onclick="go('home')">Ke Beranda</button></div>`;
/* ===== ROUTER ===== */
function go(r){location.hash=r}
function render(){
  const h=(location.hash||"#home").slice(1);let html;
  if(h==="home")html=home();else if(h.startsWith("product-"))html=product(h.slice(8));
  else if(h==="cart")html=cartPage();else if(h==="checkout")html=checkout();
  else if(h==="wishlist")html=wishPage();else if(h==="account")html=accountPage();else if(h==="admin")html=`<div id="adm"></div>`;else html=notFound();
  const y=scrollY;$("#app").innerHTML=html;document.querySelectorAll(".nb").forEach(b=>b.classList.toggle("on",b.dataset.r===(h.startsWith("product-")?"home":h)));badges();if(h==="admin")adminInit();if(h==="account")syncOrders();
  if(render.last!==h){scrollTo(0,0);render.last=h}else scrollTo(0,y);
}
addEventListener("hashchange",()=>{showLoad();});
function showLoad(){
  $("#app").innerHTML=`<div class="grid" style="margin-top:24px">${'<div class="skel"></div>'.repeat(4)}</div>`;
  setTimeout(render,180);
}
$("#q").addEventListener("input",e=>{query=e.target.value;cat="Semua";if((location.hash||"#home")!=="#home")go("home");else render()});
$("#fwa").href=$("#fab").href=`https://wa.me/${CONFIG.WA_NUMBER}?text=${encodeURIComponent("Halo AksesorisKu, saya mau tanya produk.")}`;
$("#fsp").href=CONFIG.SHOPEE_URL;
if(SB){document.body.classList.add("srv");loadProducts()}
badges();
setTimeout(()=>{$("#splash").classList.add("out");render()},3100);
setTimeout(()=>$("#splash").remove(),3700);
</script>
</body>
</html>
